name: Build Forex Robot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create .env file
        run: |
          echo "VITE_BINANCE_API_KEY=${{ secrets.VITE_BINANCE_API_KEY }}" > .env
          echo "VITE_BINANCE_SECRET_KEY=${{ secrets.VITE_BINANCE_SECRET_KEY }}" >> .env

      - name: Install npm packages
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Capacitor Android setup
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Remove google-services plugin
        run: |
          sed -i "/com.google.gms:google-services/d" android/build.gradle
          find android -name "*.gradle" -exec sed -i "/apply plugin.*google-services/d" {} \;
          find android -name "google-services.json" -delete || true

      - name: Fix gradlew permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ForexRobotSignalBot-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
